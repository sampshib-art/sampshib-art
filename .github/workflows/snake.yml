name: Generate contribution snake

on:
  # Rebuild daily so the snake tracks new contributions.
  schedule:
    - cron: "0 3 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Regenerate whenever main changes.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    # Needed to push the generated SVGs to the output branch.
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
